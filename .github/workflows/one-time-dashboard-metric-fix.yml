name: one-time-dashboard-metric-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: correct dashboard consumption metric semantics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Correct dashboard metric
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          s = s.replace('// متوسط الفرد اليومي (دورة قراءة شهرية → /30)\n    const activeSubs = customers.filter((c) => c.status !== "rejected").length || customers.length;\n    const perCapitaDaily = activeSubs > 0 ? nrw.consumed / activeSubs / 30 : 0;', '// متوسط استهلاك الاشتراك اليومي. لا نسميه "للفرد" لأن عدد أفراد الأسرة غير مسجل في بيانات المشترك.\n    const activeSubs = customers.filter((c) => c.status !== "rejected").length || customers.length;\n    const perSubscriptionDaily = activeSubs > 0 ? nrw.consumed / activeSubs / 30 : 0;')
          s = s.replace('perCapitaDaily,', 'perSubscriptionDaily,')
          s = s.replace('<div className="text-[11px] text-muted-foreground">متوسط الفرد اليومي</div>', '<div className="text-[11px] text-muted-foreground">متوسط الاشتراك اليومي</div>')
          s = s.replace('{k.perCapitaDaily.toFixed(2)}\n              <span className="text-xs font-normal text-muted-foreground"> م³/يوم</span>', '{k.perSubscriptionDaily.toFixed(2)}\n              <span className="text-xs font-normal text-muted-foreground"> م³/يوم/اشتراك</span>')
          marker = '<span className="text-xs font-normal text-muted-foreground"> م³/يوم/اشتراك</span>'
          note = '<div className="mt-2 text-[10px] text-muted-foreground">المؤشر محسوب لكل اشتراك نشط، وليس لكل فرد.</div>'
          if note not in s and marker in s:
              s = s.replace(marker + '\n            </div>', marker + '\n            </div>\n            ' + note)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git diff --cached --quiet || git commit -m 'fix: correct dashboard consumption metric semantics'
          git push
          rm -f .github/workflows/one-time-dashboard-metric-fix.yml
          git add -u .github/workflows/one-time-dashboard-metric-fix.yml
          git commit -m 'chore: remove one-time dashboard metric fix'
          git push
